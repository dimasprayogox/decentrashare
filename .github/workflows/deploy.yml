name: CI/CD Deploy Backend

on:
  push:
    branches: [ main ]  # Jalan otomatis saat push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Ambil kode dari repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Login ke Docker Hub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build & Push Image (Panggil Dockerfile di folder backend)
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend          # ← Arah ke folder backend
          push: true
          tags: ${{ secrets.dimasprayogox }}/decentrashare-backend:latest

      # 4. Deploy ke VPS via SSH
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/decentrashare
            docker compose pull
            docker compose up -d
            docker image prune -f