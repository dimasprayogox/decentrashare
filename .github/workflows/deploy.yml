name: CI/CD Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
          dimasprayogox/decentrashare-backend:latest
          dimasprayogox/decentrashare-backend:${{ github.run_number }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}   # Pastikan ini sesuai user VPS (misal: root atau murkoboy)
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          debug: true                         # Akan muncul log detail jika masih error
          script: |
            cd /var/www/decentrashare
            docker compose pull
            docker compose up -d
            docker image prune -f
